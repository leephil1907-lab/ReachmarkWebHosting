services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reachmark
      POSTGRES_USER: reachmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reachmark_postgres:/var/lib/postgresql/data
    networks:
      - reachmark-control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachmark -d reachmark"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  reachmark_postgres:

networks:
  reachmark-control:
    name: reachmark-control
